name: 更新資料並部署網站

on:
  # 每月兩次，台灣時間 10:17：
  #   10 日：PMI、物價、出口、貨幣供給等月初發布的資料
  #   28 日：外銷訂單、工業生產、景氣燈號等月下旬發布的資料
  schedule:
    - cron: "17 2 10,28 * *"
  # 可在 GitHub 的 Actions 頁面手動執行
  workflow_dispatch:
  # 程式或網頁有變更時重新部署（不重新抓資料）
  push:
    branches: [main]
    paths:
      - "site/**"
      - "pipeline/**"
      - "data/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 抓資料、產生網站並上傳；部署拆成另一個 job，避免同一 job 內查不到剛上傳的檔案
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取資料
        if: github.event_name != 'push'
        run: python -m pipeline.fetch

      - name: 產生網站資料
        run: python -m pipeline.build

      - name: 提交資料變更
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "資料沒有變化"
          else
            git commit -m "資料更新 $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
